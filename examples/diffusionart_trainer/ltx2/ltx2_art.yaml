# LTX-2.3 text-to-audio-video DiffusionART (arXiv:2610.12572). Cloned from the OmniNFT LTX-2.3 recipe
# (PR #640, examples/omninft_trainer/ltx2/ltx2_omninft.yaml) with ONLY the algorithm changed, so the two
# can be compared like-for-like: same five rewards and routing weights (VideoAlign 1.0 / HPSv3 1.5 ->
# video, AudioBox 0.5 / CLAP 1.0 -> audio, DeSync 1.0 -> both), LoRA r32/alpha64, lr 3e-5, 256x384x121f,
# 20 rollout steps, rollout CFG video 1.5 / audio 3.0. Differences forced by the algorithm: the rollout
# is an ODE (noise level 0) that keeps every visited state, the training forward uses the SAME CFG as the
# rollout (v_old is recomputed by it), the old adapter is hard-copied every step (no EMA), and
# ppo_mini_batch_size = train_batch_size / 2 gives the paper's two disjoint updates per rollout batch.
# Reward stack: the native VideoAlign / HPSv3 / AudioBox / CLAP / DeSync scorers, `backend: native`
# executors with `placement`, and the reserved `routing_weights` key are all on main since #663 part 1
# (fb5fb70). `aggregation: preserve_components` (rm_scores [B, K]) is still rejected on main until the
# companion OmniNFT consumer (#664) lands, and DiffusionART does not need it: the manager's default
# `weighted_sum` already exposes every component as `reward/<name>`, which `DiffusionARTLoss` routes to
# the video/audio latents with the `routing_weights` below. The combined weighted sum is used for
# logging/advantage metrics only.
hydra:
  searchpath:
    - pkg://verl_omni.trainer.config

defaults:
  - /diffusion_trainer
  - _self_

algorithm:
  trainer_type: direct_preference
  sample_source: online
  paired_preference: false
  timestep_fraction: 1.0
  old_policy_decay_schedule: copy
  old_policy_update_interval: 1
  norm_adv_by_std_in_grpo: true
  global_std: true
  art_pairwise_reward: false
  art_exclude_final_step: true
  art_log_rollout_velocity_gap: false
  art_modality_reward_weights: null

actor_rollout_ref:
  model:
    algorithm: diffusion_art
    model_type: diffusion_art_model
    attn_backend: native
    enable_gradient_checkpointing: true
    lora_rank: 32
    lora_alpha: 64
    policy_state_adapters: [default, old]
    target_modules:
      - attn1.to_q
      - attn1.to_k
      - attn1.to_v
      - attn1.to_out.0
      - attn2.to_q
      - attn2.to_k
      - attn2.to_v
      - attn2.to_out.0
      - audio_attn1.to_q
      - audio_attn1.to_k
      - audio_attn1.to_v
      - audio_attn1.to_out.0
      - audio_attn2.to_q
      - audio_attn2.to_k
      - audio_attn2.to_v
      - audio_attn2.to_out.0
      - audio_to_video_attn.to_q
      - audio_to_video_attn.to_k
      - audio_to_video_attn.to_v
      - audio_to_video_attn.to_out.0
      - video_to_audio_attn.to_q
      - video_to_audio_attn.to_k
      - video_to_audio_attn.to_v
      - video_to_audio_attn.to_out.0
      - ff.net.0.proj
      - ff.net.2
      - audio_ff.net.0.proj
      - audio_ff.net.2
    fsdp_layer_prefixes: [transformer_blocks.]
    pipeline:
      _target_: verl_omni.pipelines.ltx2_diffusion_art.config.LTXARTPipelineConfig
      video_cfg_scale: 1.5
      audio_cfg_scale: 3.0
  actor:
    strategy: fsdp2
    optim:
      lr: 3.0e-5
      weight_decay: 1.0e-4
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: 8
    ppo_epochs: 1
    use_kl_loss: false
    diffusion_loss:
      loss_mode: diffusion_art
      art_guidance_gain: 1.0
      art_loss_space: velocity_linear_sigma
      art_mask_metric: sde_kl
      art_mask_threshold: 1.0e-5
      art_reference_noise_level: 0.8
      art_corrective_mask_enabled: true
      art_video_weight: 1.0
      art_audio_weight: 1.0
    fsdp_config:
      model_dtype: bfloat16
      param_offload: true
      optimizer_offload: true
      offload_policy: false
      ulysses_sequence_parallel_size: 1
      wrap_policy:
        transformer_layer_cls_to_wrap: [LTX2VideoTransformerBlock]
  rollout:
    max_num_seqs: 1
    name: vllm_omni
    rollout_attn_backend: TORCH_SDPA
    free_cache_engine: true
    enable_sleep_mode: true
    seed: 42
    agent:
      default_agent_loop: ltx2_diffusion_single_turn_agent
    load_format: safetensors
    layered_summon: true
    calculate_log_probs: false
    rollout_adapter: old
    algo:
      noise_level: 0.0
    pipeline:
      _target_: verl_omni.pipelines.ltx2_diffusion_art.config.LTXARTPipelineConfig
      height: 256
      width: 384
      num_frames: 121
      frame_rate: 24.0
      num_inference_steps: 20
      video_cfg_scale: 1.5
      audio_cfg_scale: 3.0
      video_modality_scale: 1.0
      audio_modality_scale: 1.0
      video_rescale_scale: 0.0
      audio_rescale_scale: 0.0
      max_sequence_length: 1024
      output_type: pt
    val_kwargs:
      pipeline:
        _target_: verl_omni.pipelines.ltx2_diffusion_art.config.LTXARTPipelineConfig
        height: 256
        width: 384
        num_frames: 121
        frame_rate: 24.0
        num_inference_steps: 40
        video_cfg_scale: 3.0
        audio_cfg_scale: 7.0
        video_modality_scale: 3.0
        audio_modality_scale: 3.0
        video_rescale_scale: 0.7
        audio_rescale_scale: 0.7
        output_type: pt
      algo:
        noise_level: 0.0

reward:
  reward_model:
    enable: false
    enable_resource_pool: false
  accelerator_workers:
    enabled: false
  reward_manager:
    name: MultiVisualRewardManager
  aggregation: weighted_sum
  models:
    video_align:
      backend: native
      offload: true
      executor:
        model: verl_omni.utils.reward_score.videoalign:VideoAlignModel
    hpsv3:
      backend: native
      offload: true
      executor:
        model: verl_omni.utils.reward_score.hpsv3_reward:HPSv3Model
        kwargs:
          use_sequential_position_ids: true
    audiobox:
      backend: native
      offload: true
      executor:
        model: verl_omni.utils.reward_score.audiobox:AudioBoxModel
    clap:
      backend: native
      offload: true
      executor:
        model: verl_omni.utils.reward_score.clap:CLAPModel
    desync:
      backend: native
      offload: true
      executor:
        model: verl_omni.utils.reward_score.desync:DeSyncModel
  reward_functions:
    video_align:
      path: pkg://verl_omni.utils.reward_score.videoalign
      name: compute_score
      model: video_align
      prompt_key: video
      score_weights: [0.5, 0.0, 0.5]
      score_means: [3.6757, 0.0, 2.8105]
      score_stds: [2.2476, 1.0, 2.5121]
      weight: 1.0
      required: true
      routing_weights: {video: 1.0, audio: 0.0}
    hpsv3:
      path: pkg://verl_omni.utils.reward_score.hpsv3_reward
      name: compute_score_hpsv3
      model: hpsv3
      prompt_key: video
      num_frames: 5
      top_fraction: 0.3
      score_cap: 15.0
      reward_scale: 1.0
      max_batch_size: 5
      weight: 1.0
      required: true
      routing_weights: {video: 1.5, audio: 0.0}
    audiobox:
      path: pkg://verl_omni.utils.reward_score.audiobox
      name: compute_score
      model: audiobox
      axis_weights: {CE: 1.0, CU: 1.0, PC: -1.0, PQ: 1.0}
      score_scale: 0.025
      weight: 1.0
      required: true
      routing_weights: {video: 0.0, audio: 0.5}
    clap:
      path: pkg://verl_omni.utils.reward_score.clap
      name: compute_score
      model: clap
      prompt_key: audio
      score_scale: 0.5
      score_offset: 0.5
      score_min: 0.0
      score_max: 1.0
      weight: 1.0
      required: true
      routing_weights: {video: 0.0, audio: 1.0}
    desync:
      path: pkg://verl_omni.utils.reward_score.desync
      name: compute_score
      model: desync
      weight: 1.0
      required: true
      routing_weights: {video: 1.0, audio: 1.0}
